# applications.yaml
# All target applications and their environments.
# Credential values are NEVER stored here — only the name of the
# environment variable that holds the real value.
# Requires: LLM_API_KEY, DATABASE_URL in .env

applications:
  netra:
    display_name: "Netra"
    application_type: "web"
    owner: ""
    environments:
      default:
        url: "http://localhost:3000"
        requires_production_confirmation: false
        service_user_env_var: "NETRA_DEFAULT_SERVICE_USER"
        service_password_env_var: "NETRA_DEFAULT_SERVICE_PASSWORD"

